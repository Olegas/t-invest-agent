services:
  opencode:
    build: .
    image: invest-opencode:latest
    container_name: invest-opencode
    restart: unless-stopped
    ports:
      - "4444:4444"
    environment:
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:?set OPENCODE_PASSWORD in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      TINVEST_MCP_TOKEN: ${TINVEST_MCP_TOKEN:?set TINVEST_MCP_TOKEN in .env}
    volumes:
      - opencode-share:/root/.local/share/opencode
      - opencode-state:/root/.local/state/opencode
      - opencode-work:/root/work

volumes:
  opencode-share:
  opencode-state:
  opencode-work:
